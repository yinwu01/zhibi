[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zhibi"
version = "0.5.0a1"
description = "Local-first network environment preparation with traceable evidence."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Zhibi contributors"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/yinwu01/cc-zhibi"
Repository = "https://github.com/yinwu01/cc-zhibi"
Issues = "https://github.com/yinwu01/cc-zhibi/issues"

[project.optional-dependencies]
mmdb = ["maxminddb>=2.6,<4"]
vault = ["cryptography>=43,<47"]
dev = ["jsonschema>=4.18,<5", "build>=1,<2", "PyYAML>=6,<7", "markdown-it-py>=3,<5"]

[project.scripts]
zhibi = "zhibi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zhibi = ["data/*.json", "assets/*.html", "assets/*.css", "assets/*.js", "assets/*.txt"]
