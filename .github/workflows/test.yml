name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-sandbox:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python scripts/verify_process_workspace.py
        env:
          PYTHONPATH: src
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Build pinned external graftcp and verify proxy namespace
        run: |
          git init "$RUNNER_TEMP/graftcp"
          git -C "$RUNNER_TEMP/graftcp" fetch --depth 1 https://github.com/hmgle/graftcp.git 574b30bfe1d4d36b3f3bff72041665b4df19573f
          git -C "$RUNNER_TEMP/graftcp" checkout --detach FETCH_HEAD
          make -C "$RUNNER_TEMP/graftcp" -j2
          python scripts/verify_proxy_workspace.py "$RUNNER_TEMP/graftcp/local/graftcp"
        env:
          PYTHONPATH: src
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python scripts/check_repository.py
      - run: python scripts/verify_skill.py
      - run: python -m build
      - run: python scripts/verify_distribution.py
  optional-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,vault,mmdb]"
      - run: python -m unittest discover -s tests -p test_optional_modules.py -v
        env:
          PYTHONPATH: src
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/build_examples.py
      - run: python scripts/build_start.py
      - run: python scripts/render_readme.py
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.cjs
      - run: node tests/browser-details.cjs
      - run: python -m zhibi browser --advanced --out .preview/network.html
      - run: node tests/browser-extras.cjs .preview/network.html
      - run: node tests/browser-network.cjs
        env:
          ZHIBI_TEST_PYTHON: python
      - run: python -m pip install "paramiko>=3,<5"
      - name: SSH and browser proxy integration
        run: |
          export CHROME_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          python scripts/verify_ssh_integration.py
          python scripts/verify_browser_workspace.py
